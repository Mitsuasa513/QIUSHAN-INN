<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23e7bd4a' stroke='%236b4c14' stroke-width='2'/><rect x='12' y='12' width='8' height='8' fill='%232b2117'/></svg>">
<title>秋山客栈 · 3D 沙盘</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #2b2117; }
  #app { width: 100%; height: 100%; }
  .panel {
    position: fixed; left: 16px; top: 14px; z-index: 10;
    color: #f5e6c8; font-family: "KaiTi","STKaiti","Noto Serif CJK SC","WenQuanYi Zen Hei",serif;
    background: rgba(30, 22, 14, .62); border: 1px solid rgba(245, 214, 150, .35);
    border-radius: 10px; padding: 10px 16px; user-select: none;
    backdrop-filter: blur(4px);
  }
  .panel h1 { margin: 0; font-size: 21px; letter-spacing: 4px; font-weight: 600; }
  .panel p { margin: 5px 0 0; font-size: 12.5px; opacity: .78; letter-spacing: 1px; }
  #ui {
    position: fixed; right: 16px; bottom: 16px; z-index: 10;
    display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px;
    max-width: calc(100vw - 32px);
    font-family: "KaiTi","STKaiti","Noto Serif CJK SC","WenQuanYi Zen Hei",serif;
  }
  #ui button { white-space: nowrap; }   /* v634 按钮文字禁中间折行：宁可整行换到第二排 */

  #ui button {
    cursor: pointer; padding: 8px 14px; font-size: 14px; letter-spacing: 1px;
    color: #f5e6c8; background: rgba(30, 22, 14, .72);
    border: 1px solid rgba(245, 214, 150, .4); border-radius: 8px;
    transition: background .2s;
  }
  #ui button:hover { background: rgba(70, 50, 28, .85); }
  #ui .spd { display: inline-flex; align-items: center; gap: 7px; padding: 4px 12px;
    color: #f5e6c8; background: rgba(30, 22, 14, .72);
    border: 1px solid rgba(245, 214, 150, .4); border-radius: 8px; font-size: 13px; letter-spacing: 1px;
    vertical-align: middle; }
  #ui .spd input[type=range] { width: 92px; accent-color: #e8b34b; cursor: pointer; }
  #ui .spd b { min-width: 30px; text-align: right; font-weight: 400; color: #ffd98c; }
  #ui button.on { background: rgba(126, 88, 36, .92); border-color: #e8c274; color: #fff3d6; }
  #cineVignette {
    position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0;
    transition: opacity .8s;
    background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,.28) 82%, rgba(8,4,2,.62) 100%);
  }
  #cineBars { position: fixed; inset: 0; z-index: 6; pointer-events: none; opacity: 0; transition: opacity .8s; }
  #cineBars::before, #cineBars::after {
    content: ''; position: absolute; left: 0; right: 0; height: 4.2vh; background: #05030a;
  }
  #cineBars::before { top: 0; } #cineBars::after { bottom: 0; }
  #cineFlash { position: fixed; inset: 0; z-index: 7; pointer-events: none; opacity: 0; background: #dfe8ff; }
  #loading {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    color: #f5e6c8; background: rgba(30, 22, 12, .5);
    backdrop-filter: blur(16px) saturate(.9); -webkit-backdrop-filter: blur(16px) saturate(.9);
    font-size: 18px; letter-spacing: 3px;
    font-family: "KaiTi","STKaiti","Noto Serif CJK SC","WenQuanYi Zen Hei",serif;
    transition: opacity .9s; cursor: default;
  }
  #loading h2 { margin: 0; font-size: clamp(28px, 5vw, 46px); font-weight: 600; letter-spacing: 10px; color: #f0d9a0; text-shadow: 0 2px 18px rgba(0,0,0,.6); }
  #loading .bar { width: min(430px, 74vw); height: 10px; border: 1px solid #b98d3f; border-radius: 8px; background: rgba(20, 14, 8, .55); overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 0%; border-radius: 8px; background: linear-gradient(90deg, #8a6a2a, #ffd75e); transition: width .3s; }
  #loading .pct { font-size: 14px; opacity: .92; letter-spacing: 2px; }
  @media (max-width: 1180px) {          /* v634 窄屏先缩字号缩内边距，缩不动才换行 */
    #ui { gap: 6px; }
    #ui button { padding: 6px 10px; font-size: 12.5px; }
    #ui .spd { font-size: 12px; }
    #ui .spd input[type=range] { width: 90px; }
  }
  @media (max-width: 860px) {
    #ui button { padding: 5px 8px; font-size: 11px; letter-spacing: 0; }
  }
</style>
</head>
<body>
  <div id="app"></div>
  <div class="panel">
    <h1>秋山客栈 · 沙盘</h1>
    <p id="fpsLine" style="font-size:13px;color:#9fd89f;letter-spacing:1px;opacity:.9">FPS —</p>
    <p>左键拖拽旋转 · 滚轮缩放 · 右键平移</p>
    <p id="pelKeys" style="display:none;color:#ffd98c">🦅 <b>鹈鹕模式</b>：WASD 移动 · Shift 疾飞 · 空格 跳/浮潜 · F 开门<br>⬆⬇⬅➡ 或 右键拖拽 转视角 · 滚轮 远近 · 鹈鹕按钮 退出</p>
  </div>
  <div id="ui">
    <button id="btnRotate">⏸ 停止旋转</button>
    <span class="spd">🔄 速度<input type="range" id="spdRange" min="0" max="40" step="1" value="7"><b id="spdVal">0.7</b></span>
    <button id="btnMorn">🌅 上午</button>
    <button id="btnDay" class="on">🌇 下午</button>
    <button id="btnNight">🌙 上半夜</button>
    <button id="btnDeep">🌌 下半夜</button>
    <button id="btnCycle">🔁 滚动</button>
    <button id="btnCine">🎬 电影</button>
    <button id="btnStorm">⛈ 雷阵雨</button>
    <button id="btnPel">🐦 鹈鹕模式</button>
    <button id="btnReset">↺ 重置视角</button>
  </div>
  <div id="cineVignette"></div>
  <div id="cineBars"></div>
  <div id="cineFlash"></div>
  <div id="loading">
    <h2>行者十六 · 秋山客栈</h2>
    <div class="pct" id="ldTxt">正在加载中 0%</div>
    <div class="bar"><i id="ldBar"></i></div>
  </div>
  <script src="vendor/three.min.js"></script>
  <script src="vendor/OrbitControls.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
  <script src="vendor/postprocessing/EffectComposer.js"></script>
  <script src="vendor/shaders/CopyShader.js"></script>
  <script src="vendor/shaders/LuminosityHighPassShader.js"></script>
  <script src="vendor/shaders/GammaCorrectionShader.js"></script>
  <script src="vendor/postprocessing/RenderPass.js"></script>
  <script src="vendor/postprocessing/ShaderPass.js"></script>
  <script src="vendor/postprocessing/MaskPass.js"></script>
  <script src="vendor/postprocessing/UnrealBloomPass.js"></script>
  <script src="main.js?v=644"></script>
</body>
</html>
